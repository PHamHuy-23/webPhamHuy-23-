<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Algorithm Visualizer - Puzzle & Maze Solver</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>⚙️ AI ALGORITHM VISUALIZER</h1>
    <p>8-Puzzle & Maze Solving with BFS, DFS, DLS, Greedy & A*</p>
</header>

<main>
    <!-- ===== LEFT: CONTROL PANEL ===== -->
    <section id="controlPanel">
        <h2>🎮 CONTROL PANEL</h2>

        <!-- Problem Mode -->
        <div class="control-group">
            <label>Problem Mode:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="mode" value="puzzle" checked onchange="switchMode('puzzle')">
                    8-PUZZLE
                </label>
                <label>
                    <input type="radio" name="mode" value="maze" onchange="switchMode('maze')">
                    MAZE WORLD
                </label>
            </div>
        </div>

        <!-- Algorithm Selection -->
        <div class="control-group">
            <label>Algorithm:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="algorithm" value="bfs" checked>
                    BFS
                </label>
                <label>
                    <input type="radio" name="algorithm" value="dfs">
                    DFS
                </label>
                <label>
                    <input type="radio" name="algorithm" value="dls">
                    DLS
                </label>
                <label>
                    <input type="radio" name="algorithm" value="greedy">
                    GREEDY
                </label>
                <label>
                    <input type="radio" name="algorithm" value="astar">
                    A*
                </label>
            </div>
        </div>

        <!-- Goal Check Mode -->
        <div class="control-group">
            <label>Goal Check:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="goalCheck" value="evaluation" checked>
                    Evaluation
                </label>
                <label>
                    <input type="radio" name="goalCheck" value="generation">
                    Generation
                </label>
            </div>
        </div>

        <!-- Depth Limit (for DLS) -->
        <div class="control-group hidden" id="dlsOptions">
            <label>Depth Limit: <span class="label-value" id="dlsLimitValue">5</span></label>
            <input type="range" id="dlsLimit" min="1" max="15" value="5" onchange="updateDLSLimit()">
        </div>

        <!-- Maze Size -->
        <div class="control-group hidden" id="mazeOptions">
            <label>Maze Size: <span class="label-value" id="mazeSizeValue">10</span></label>
            <input type="range" id="mazeSize" min="5" max="20" value="10" onchange="updateMazeSize()">
        </div>

        <!-- Puzzle Preset -->
        <div class="control-group" id="puzzlePresets">
            <label>Puzzle State:</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem;">
                <button class="pixel-btn pixel-btn-secondary" onclick="setPuzzlePreset('easy')">Easy</button>
                <button class="pixel-btn pixel-btn-secondary" onclick="setPuzzlePreset('medium')">Medium</button>
                <button class="pixel-btn pixel-btn-secondary" onclick="setPuzzlePreset('hard')">Hard</button>
                <button class="pixel-btn pixel-btn-secondary" onclick="randomizePuzzle()">Random</button>
            </div>
        </div>

        <!-- Speed Control -->
        <div class="control-group">
            <label>Speed: <span class="label-value" id="speedValue">50ms</span></label>
            <input type="range" id="speed" min="10" max="500" value="50" onchange="updateSpeed()">
        </div>

        <!-- Execution Controls -->
        <div style="display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-top: 1rem;">
            <button id="startBtn" class="pixel-btn pixel-btn-primary" onclick="startSolving()">▶ START</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <button id="pauseBtn" class="pixel-btn pixel-btn-secondary" onclick="togglePause()" disabled>⏸ PAUSE</button>
                <button id="stepBtn" class="pixel-btn pixel-btn-secondary" onclick="nextStep()" disabled>▶ STEP</button>
            </div>
            <button id="resetBtn" class="pixel-btn pixel-btn-danger" onclick="resetVisualizer()">🔄 RESET</button>
        </div>
    </section>

    <!-- ===== MIDDLE: VISUALIZATION PANEL ===== -->
    <section id="vizPanel">
        <h2>🖥️ VISUALIZATION</h2>
        <div class="viz-container">
            <div id="puzzleBoard"></div>
            <div id="mazeBoard" class="hidden"></div>
        </div>
    </section>

    <!-- ===== RIGHT: DATA TABLE PANEL ===== -->
    <section id="tablePanel">
        <h2>📊 STATE TRACKING</h2>
        <div class="table-wrapper">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>State Index</th>
                        <th>Current State</th>
                        <th>Frontier Size</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </section>
</main>

<!-- Modal for messages -->
<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 id="modalTitle">🏆 SUCCESS!</h3>
        <p id="modalMessage">...</p>
        <button class="pixel-btn pixel-btn-primary" onclick="closeModal()">OK</button>
    </div>
</div>

<!-- Scripts -->
<script src="script.js"></script>
</body>
</html>
